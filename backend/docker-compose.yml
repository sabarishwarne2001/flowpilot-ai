# =============================================================================
# FlowPilot AI — Separated Process Fleet (ARCH-10 Step 8, ARCH-0G §4.4)
# =============================================================================

name: flowpilot

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-flowpilot}:${POSTGRES_PASSWORD:-flowpilot}@db:5432/${POSTGRES_DB:-flowpilot}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot}
  POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
  REDIS_URL: redis://redis:6379/0
  DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
  DATABASE_REPLICA_ENFORCE_READ_ONLY: ${DATABASE_REPLICA_ENFORCE_READ_ONLY:-true}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  TRUSTED_PROXY_HOPS_CONFIRMED: ${TRUSTED_PROXY_HOPS_CONFIRMED:-false}
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set. Generate one with openssl rand -hex 32}"
  ENVIRONMENT: ${ENVIRONMENT:-development}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  S3_BUCKET: ${S3_BUCKET:-flowpilot-dev}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  # F-027: the local MinIO's own credentials, never the shell's AWS keys.
  # Compose prefers the shell environment over .env, so the AWS variable
  # here copied a developer's real AWS key id into MinIO and every container.
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  UPLOAD_DIR: uploads
  RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
  RERANKER_URL: ${RERANKER_URL:-http://reranker:8081}
  RERANKER_INTERNAL_TOKEN: "${RERANKER_INTERNAL_TOKEN:?RERANKER_INTERNAL_TOKEN must be set. Generate one with openssl rand -hex 32}"

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: flowpilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot}
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpilot} -d ${POSTGRES_DB:-flowpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    container_name: flowpilot-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # minio/minio and minio/mc were removed from Docker Hub (MinIO stopped
    # publishing community images). pgsty/* rebuilds upstream MinIO from
    # source. Pinned so a fresh clone gets the same bytes every time.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: flowpilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: flowpilot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-flowpilot-dev} &&
      mc ilm rule add --expire-delete-marker --noncurrent-expire-days 1 local/${S3_BUCKET:-flowpilot-dev} || true
      "

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: flowpilot-migrate
    environment:
      <<: *app-env
      SERVICE_ROLE: migrate
      # Dev only: head ends at the flag-gated ARCH-40 contract step, which
      # the models already assume. docker-compose.prod.yml does not set it.
      ARCH40_CONTRACT: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: flowpilot-web
    environment:
      <<: *app-env
      SERVICE_ROLE: web
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: flowpilot-worker-relay
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-relay
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker", "--loop", "relay", "--per-org-cap", "5"]
    restart: unless-stopped

  worker-delivery:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: flowpilot-worker-delivery
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-delivery
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker", "--loop", "delivery", "--per-org-cap", "5"]
    restart: unless-stopped

  worker-light:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: flowpilot-worker-light
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-light
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker", "--loop", "jobs", "--profile", "light"]
    restart: unless-stopped

  # HARDENING-T1:D15. Without this service nothing enqueues recurring jobs in
  # this stack: no usage rollups (billing shows zero), no dunning, no
  # sweeps. docker-compose.prod.yml has always had it; this file did not.
  # Exactly one replica: the scheduler is the single source of cadence.
  worker-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: flowpilot-worker-scheduler
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-light
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker", "--loop", "scheduler"]
    restart: unless-stopped

  worker-stripe:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: flowpilot-worker-stripe
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-stripe
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker", "--loop", "stripe"]
    restart: unless-stopped

  worker-ocr:
    build:
      context: .
      dockerfile: Dockerfile
      target: ocr
    container_name: flowpilot-worker-ocr
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-ocr
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [
      "python", "-m", "app.worker",
      "--loop", "jobs",
      "--profile", "ocr",
      "--batch-size", "4",
      "--per-org-cap", "2",
      "--lease-seconds", "600"
    ]
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  worker-enrich:
    build:
      context: .
      dockerfile: Dockerfile
      target: enrich
    container_name: flowpilot-worker-enrich
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-enrich
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [
      "python", "-m", "app.worker",
      "--loop", "jobs",
      "--profile", "enrich",
      "--batch-size", "4",
      "--per-org-cap", "2",
      "--lease-seconds", "600"
    ]
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  reranker:
    build:
      context: .
      dockerfile: app/reranker/Dockerfile
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    container_name: flowpilot-reranker
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANKER_INTERNAL_TOKEN: "${RERANKER_INTERNAL_TOKEN:?RERANKER_INTERNAL_TOKEN must be set. Generate one with openssl rand -hex 32}"
      RERANKER_MAX_PAIRS: ${RERANKER_MAX_PAIRS:-100}
      RERANKER_MAX_TEXT_CHARS: ${RERANKER_MAX_TEXT_CHARS:-4000}
      RERANKER_MAX_QUERY_CHARS: ${RERANKER_MAX_QUERY_CHARS:-1000}
      RERANKER_PRELOAD: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - reranker_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  reranker_models:
