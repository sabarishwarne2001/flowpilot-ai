# ARCH-0V Tranche 1 — the verification substrate.
#
# WHAT THIS FIXES
#
# At ARCH-22 completion the repository contained 56 `scripts/verify_*.py`
# gates and 116 test files, and none of them ran unless a human typed the
# command. Twenty-two phases of architectural invariants — cost-basis
# truthfulness, tenant isolation, orphaned-guard detection, migration head
# discipline — were enforced by memory rather than by mechanism.
#
# ARCH-02 Step 10 described the tenant isolation suite as "a permanent CI
# gate". It was not a gate. This file is what makes that sentence true.
#
# JOB LAYOUT
#
#   encoding      — cheapest checks first; fails in ~15s if a BOM lands
#   (backend-gates — the historical verify_*.py gates — was retired in the final release:
#    the gates are in archive/, superseded by the pytest suites below; see archive/README.md)
#   backend-tests — pytest against real Postgres + Redis
#   migrations    — upgrade head, zero autogenerate drift, exactly one head
#   frontend      — tsc, lint, build
#
# `encoding` gates the rest deliberately: if the manifests are unreadable
# there is no point spending six minutes installing from them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match backend/Dockerfile (python:3.12-slim). requirements.txt pins
  # scipy==1.18.0, which has no Python 3.11 build.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # Encoding — 15 seconds, no dependencies, gates everything downstream.
  # ---------------------------------------------------------------------
  encoding:
    name: Encoding & line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: No BOMs, no UTF-16, no CRLF in tracked text files
        working-directory: backend
        run: python scripts/normalize_encodings.py --check

  # ---------------------------------------------------------------------
  # Test suites — real Postgres, real Redis.
  # ---------------------------------------------------------------------
  # Campaign session 4 (F-030): the suite runs once, split across four parallel jobs by test file
  # (tests/conftest.py, PYTEST_SHARD; tests/infra/test_ci_shards_cover_the_suite.py proves every
  # file is in exactly one shard). Before, the security and engine "proof" steps ran first and the
  # full suite then ran them again, ~1 h 40 min in one job.
  backend-tests:
    name: pytest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: encoding
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: servabo
          POSTGRES_PASSWORD: servabo
          POSTGRES_DB: servabo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Migrate the test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://servabo:servabo@localhost:5432/servabo_test
          # app.core.config builds the database URI from POSTGRES_*; DATABASE_URL
          # is read only by the backup scripts.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: servabo
          POSTGRES_PASSWORD: servabo
          POSTGRES_DB: servabo_test
          # Fresh, throwaway database: the lossy ARCH-40 contract step has
          # nothing to lose here, and the models already assume it ran.
          ARCH40_CONTRACT: "1"
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
        run: alembic upgrade head

      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://servabo:servabo@localhost:5432/servabo_test
          # app.core.config builds the database URI from POSTGRES_*; DATABASE_URL
          # is read only by the backup scripts.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: servabo
          POSTGRES_PASSWORD: servabo
          POSTGRES_DB: servabo_test
          # Fresh, throwaway database: the lossy ARCH-40 contract step has
          # nothing to lose here, and the models already assume it ran.
          ARCH40_CONTRACT: "1"
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
          # Non-zero so the ARCH-0V timing-floor tests exercise the real path.
          AUTH_LOGIN_MIN_DURATION_MS: "250"
          # See the Phase 2 step: a declared (never contacted) platform mail relay.
          PLATFORM_SMTP_HOST: 127.0.0.1
          PLATFORM_SMTP_PORT: "1"
          PLATFORM_SMTP_USERNAME: ci-relay
          PLATFORM_SMTP_PASSWORD: ci-relay-password
          PLATFORM_SMTP_ENCRYPTION: NONE
          PYTEST_SHARD: ${{ matrix.shard }}/4
        # No --maxfail: a red shard names every failing test, not the first five.
        run: pytest -q --junitxml=test-reports/shard-${{ matrix.shard }}.xml

      - name: Name the failing tests
        # Without this a red run says only "exit code 1": the failing tests' names are in the raw
        # log, which not every tool that checks a pull request can read. One annotation per
        # failing test (readable through the check-runs API) and the full list in the job summary.
        if: failure()
        run: python .github/scripts/annotate_test_failures.py backend/test-reports/*.xml

  # ---------------------------------------------------------------------
  # Migrations — head discipline, per invariant I10.
  # ---------------------------------------------------------------------
  migrations:
    name: Migration head & drift
    runs-on: ubuntu-latest
    needs: encoding

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: servabo
          POSTGRES_PASSWORD: servabo
          POSTGRES_DB: servabo_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exactly one head
        working-directory: backend
        env: &migrate_env
          DATABASE_URL: postgresql+psycopg://servabo:servabo@localhost:5432/servabo_migrate
          # app.core.config builds the database URI from POSTGRES_*; DATABASE_URL
          # is read only by the backup scripts.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: servabo
          POSTGRES_PASSWORD: servabo
          POSTGRES_DB: servabo_migrate
          # Fresh, throwaway database: the lossy ARCH-40 contract step has
          # nothing to lose here, and the models already assume it ran.
          ARCH40_CONTRACT: "1"
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads."
            exit 1
          fi

      - name: Upgrade to head
        working-directory: backend
        env: *migrate_env
        run: alembic upgrade head

      - name: Downgrade one step and upgrade again
        working-directory: backend
        env: *migrate_env
        run: |
          alembic downgrade -1
          alembic upgrade head

      # Campaign session 4 (F-330): the whole chain, not one step. A downgrade is the way back
      # from a bad deploy; until this ran, ten of them could not be taken.
      - name: Downgrade to base and upgrade again
        working-directory: backend
        env: *migrate_env
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: No new autogenerate drift
        # The old inline check grepped ci_drift_probe.py, but alembic.ini
        # names the probe <rev>_<slug>.py, so it never found the file and
        # always passed. Known drift is listed in alembic/drift_baseline.txt
        # (FINDINGS F-017); this fails on any new drift and on any listed
        # line that no longer drifts.
        working-directory: backend
        env: *migrate_env
        run: python scripts/check_migration_drift.py

  # ---------------------------------------------------------------------
  # Frontend — typecheck, lint (functional from ARCH-0V Tranche 3), build.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: encoding
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Typecheck the browser tests
        working-directory: frontend
        run: npx tsc -p e2e/tsconfig.json

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The tenant-resolution, path, reconciliation and permission self-checks; before, they ran
      # only in a development browser's console.
      - name: Self-checks
        working-directory: frontend
        run: npm run check:self

      - name: Build
        working-directory: frontend
        run: npm run build

      # F-038. A source map is the original TypeScript source and Caddy serves
      # all of dist/, so a built map is a public map.
      - name: No source maps in the production bundle
        working-directory: frontend
        run: node scripts/check-no-sourcemaps.mjs --dist

      # F-039. Blocking at "high": the lockfile had 6 high advisories until the
      # non-breaking `npm audit fix` in Phase 2. Keep it at zero.
      - name: npm audit (high and critical)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Advisory: known vulnerabilities in the pinned Python packages (F-039).
  # Not part of the required aggregate, on purpose: the remaining findings need
  # a FastAPI/Starlette line upgrade and a cryptography major bump that must be
  # done together with the full test suite (see docs/hardening/02-security-deploy.md).
  # The job keeps the list visible on every pull request instead of stale.
  # ---------------------------------------------------------------------
  dependency-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip --progress-spinner off

  # ---------------------------------------------------------------------
  # Phase 3 browser tests (Playwright, headless Chromium) against the real API,
  # worker, Postgres and Redis, with ML_STUBS=true and a local SMTP sink. See
  # frontend/e2e/README.md and docs/hardening/03-coverage.md.
  #
  # REQUIRED since campaign session 4: in the aggregate `ci` job below. The suite
  # is strict (any console error or unexpected 4xx/5xx fails a test) and has been
  # green on every complete run since session 3. On a push to main it is skipped
  # (pull requests and manual runs only), which the aggregate treats as passing.
  # ---------------------------------------------------------------------
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: encoding
    timeout-minutes: 90

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: servabo
          POSTGRES_PASSWORD: servabo
          POSTGRES_DB: servabo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: servabo
      POSTGRES_PASSWORD: servabo
      POSTGRES_DB: servabo_e2e
      REDIS_URL: redis://localhost:6379/0
      ARCH40_CONTRACT: "1"
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
      API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
      REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
      RERANKER_INTERNAL_TOKEN: ci-only-not-a-real-token-0123456789abcdef01234567
      EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      ML_STUBS: "true"
      STORAGE_BACKEND: local
      RATE_LIMIT_ENABLED: "false"
      PLATFORM_SMTP_HOST: 127.0.0.1
      PLATFORM_SMTP_PORT: "1025"
      PLATFORM_SMTP_USERNAME: e2e-relay
      PLATFORM_SMTP_PASSWORD: e2e-relay-password
      PLATFORM_SMTP_ENCRYPTION: NONE
      E2E_PYTHON: python
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
      # F-063: a deterministic local model stand-in (frontend/e2e/support/llm-mock.mjs) behind the
      # sovereign edition's LOCAL_LLM_MODE=exclusive, so extraction, verification, the review queue,
      # tables, matching and the assistant run end to end without a provider key.
      E2E_LLM: "1"
      # N-015: the production bundle is served with the production Content-Security-Policy (read
      # from backend/deploy/Caddyfile) enforced, so a page that loads or connects to anything the
      # policy forbids fails here instead of for a customer.
      E2E_CSP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start the API, worker and mail sink
        run: frontend/e2e/scripts/start-stack.sh

      - name: Run the browser tests
        working-directory: frontend
        env:
          CI: "1"
        run: npx playwright test -c e2e

      # Website and payments session (C1): the journeys above bill through the stand-in Dodo, the
      # production gateway. The Stripe journeys are kept: the same journeys again on Stripe's side.
      - name: Run the customer journeys on Stripe
        working-directory: frontend
        env:
          CI: "1"
          E2E_GATEWAY: stripe
        run: |
          ../frontend/e2e/scripts/start-stack.sh
          npx playwright test -c e2e tests/6

      - name: Name the failing browser tests
        # Same reason as in the pytest job: annotations are readable where the raw log is not.
        if: failure()
        run: python .github/scripts/annotate_test_failures.py frontend/e2e/test-results/results.json

      - name: Upload the report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
            e2e-logs
          retention-days: 14

  # ---------------------------------------------------------------------
  # The public website (website/, Astro, static). Website and payments session: it must build,
  # type-check, link, validate and pass axe in both themes and Lighthouse >= 95 on home, pricing
  # and Helm before it can ship. Required through the aggregate job below.
  # ---------------------------------------------------------------------
  website:
    name: Website
    runs-on: ubuntu-latest
    needs: encoding
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Chromium for the checks
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: No broken internal links
        run: npm run check:links

      - name: HTML validates
        run: npm run check:html

      - name: Accessibility in both themes, no sideways scroll, no console errors under the CSP
        run: npm run check:a11y

      - name: Lighthouse at least 95 on home, pricing and Helm
        run: npm run check:lighthouse

      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------
  # Aggregate status. Branch protection points at this one job, so adding a
  # job above does not require editing the protection rule.
  # ---------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [encoding, backend-tests, migrations, frontend, e2e, website]
    steps:
      - name: Fail if any upstream job failed
        # Expressions accept only single-quoted strings. A double-quoted ","
        # here made GitHub reject the whole file, so no job ever ran.
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs green."
