[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
env =
    ENVIRONMENT=test
    RATE_LIMIT_ENABLED=False
    # conftest creates a fresh test database and upgrades it to head, which
    # ends at the flag-gated ARCH-40 contract step. Nothing to lose there.
    ARCH40_CONTRACT=1
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration_s3: marks tests as S3 integration tests requiring a live endpoint
    no_db: test must run without any database dependency
