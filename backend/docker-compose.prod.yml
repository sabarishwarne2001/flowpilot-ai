# =============================================================================
# FlowPilot AI — production stack for a single Linux host.
#
#   cd /srv/flowpilot/backend
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Sized for a 4 vCPU / 16 GB VPS (Hetzner CPX41, DigitalOcean g-4vcpu-16gb,
# AWS m6i.xlarge). The OCR worker is the memory floor: PaddleOCR resident is
# roughly 2.5 GB, so do not run this on 8 GB with an enrich worker alongside.
#
# Differences from docker-compose.yml that matter:
#
#   * No published database, Redis or MinIO ports. Only Caddy is reachable
#     from outside. The dev file publishes 5432 and 9000 to the host, which
#     on a public VPS is an open Postgres.
#   * Gunicorn with uvicorn workers, not bare uvicorn --reload.
#   * A dedicated `worker-scheduler` service. Without it, nothing enqueues
#     usage.rollup, billing.dunning_sweep, tls.renew_sweep,
#     analytics.warehouse_push or partner.rev_share_compute, and the
#     platform bills nothing while every dashboard reads a plausible zero.
#     Exactly one replica: the advisory lock makes more than one safe, but
#     there is no reason to pay for it.
#   * Caddy terminates TLS and issues certificates through ACME. It also
#     serves the built frontend, so there is no Node process in production.
#   * Every service has an explicit memory limit. An unbounded OCR worker
#     will OOM-kill Postgres on a shared host, which looks like data loss.
# =============================================================================

name: flowpilot-prod

x-app-env: &app-env
  ENVIRONMENT: production
  SERVICE_ROLE: ${SERVICE_ROLE:-web}

  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowpilot}
  DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
  DATABASE_REPLICA_ENFORCE_READ_ONLY: ${DATABASE_REPLICA_ENFORCE_READ_ONLY:-true}

  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis

  # Caddy adds exactly one X-Forwarded-For hop. Leave
  # TRUSTED_PROXY_HOPS_CONFIRMED false until you have verified the header
  # end to end from a real client — until then tenants cannot enable IP
  # pinning, which is the correct failure direction.
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  TRUSTED_PROXY_HOPS_CONFIRMED: ${TRUSTED_PROXY_HOPS_CONFIRMED:-false}

  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set. openssl rand -hex 32}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER must be set. openssl rand -hex 32}
  REDIS_IDENTITY_PEPPER: ${REDIS_IDENTITY_PEPPER:?REDIS_IDENTITY_PEPPER must be set}
  EMAIL_ENCRYPTION_KEYS: ${EMAIL_ENCRYPTION_KEYS:?EMAIL_ENCRYPTION_KEYS must be set. Newest Fernet key first}

  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set, e.g. https://app.example.com}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}

  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
  S3_REGION: ${S3_REGION:-auto}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_PREFIX: ${S3_PREFIX:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
  S3_REGIONAL_BUCKETS: ${S3_REGIONAL_BUCKETS:-{}}

  RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
  RERANKER_URL: http://reranker:8081
  RERANKER_INTERNAL_TOKEN: ${RERANKER_INTERNAL_TOKEN:?RERANKER_INTERNAL_TOKEN must be set}

  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRETS: ${STRIPE_WEBHOOK_SECRETS:-}
  STRIPE_LIVEMODE: ${STRIPE_LIVEMODE:-false}

  PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
  PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-587}
  PLATFORM_SMTP_USERNAME: ${PLATFORM_SMTP_USERNAME:-}
  PLATFORM_SMTP_PASSWORD: ${PLATFORM_SMTP_PASSWORD:-}
  PLATFORM_SMTP_ENCRYPTION: ${PLATFORM_SMTP_ENCRYPTION:-TLS}
  PLATFORM_SMTP_FROM_EMAIL: ${PLATFORM_SMTP_FROM_EMAIL:-}
  PLATFORM_SMTP_FROM_NAME: ${PLATFORM_SMTP_FROM_NAME:-FlowPilot AI}

  CUSTOM_DOMAINS_ENABLED: ${CUSTOM_DOMAINS_ENABLED:-false}
  PLATFORM_RESERVED_HOSTS: ${PLATFORM_RESERVED_HOSTS:-[]}
  ACME_AGENT_URL: ${ACME_AGENT_URL:-}
  ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:-}

  LLM_METERING_ENABLED: "true"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-depends-on-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully

services:

  # ---------------------------------------------------------------- data ---

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      # Tuned for 16 GB. Raise shared_buffers to 25% of RAM on a larger box.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-flowpilot}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # noeviction is deliberate. Rate-limit counters and idempotency markers
    # must not be silently dropped under memory pressure; a hard failure is
    # recoverable, a silently-reset rate limiter is not.
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # Only used when STORAGE_BACKEND=minio. On a real deployment prefer S3, R2
  # or Backblaze B2 and delete this service: object durability is not
  # something a single VPS disk provides.
  minio:
    image: minio/minio:latest
    profiles: ["self-hosted-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ----------------------------------------------------------- migrations ---

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: flowpilot/web:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: migrate
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ------------------------------------------------------------------ api ---

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: flowpilot/web:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: web
    <<: *after-migrate
    # Gunicorn supervises the uvicorn workers and recycles them. --timeout is
    # generous because SSE streams are long-lived; --graceful-timeout gives
    # the ARCH-12 finally-block settlement time to run so a redeploy does not
    # strand unbilled tokens.
    command:
      - gunicorn
      - app.main:app
      - --worker-class=uvicorn.workers.UvicornWorker
      - --workers=4
      - --bind=0.0.0.0:8000
      - --timeout=180
      - --graceful-timeout=45
      - --keep-alive=75
      - --max-requests=2000
      - --max-requests-jitter=200
      - --access-logfile=-
      - --error-logfile=-
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # -------------------------------------------------------------- workers ---

  # RH-5. The producer for every recurring maintenance job. Exactly one
  # replica. Removing this service silently stops metering rollups, dunning,
  # certificate renewal, warehouse egress and revenue share.
  worker-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: flowpilot/worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-light
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "scheduler"]
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  worker-light:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: flowpilot/worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-light
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "jobs", "--profile", "light"]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  worker-relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: flowpilot/worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-relay
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "relay", "--per-org-cap", "5"]
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  worker-delivery:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: flowpilot/worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-delivery
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "delivery", "--per-org-cap", "5"]
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  worker-stripe:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: flowpilot/worker:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-stripe
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "stripe"]
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  worker-ocr:
    build:
      context: .
      dockerfile: Dockerfile
      target: ocr
    image: flowpilot/ocr:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-ocr
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "jobs", "--profile", "ocr"]
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  worker-enrich:
    build:
      context: .
      dockerfile: Dockerfile
      target: enrich
    image: flowpilot/enrich:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: worker-enrich
    <<: *after-migrate
    command: ["python", "-m", "app.worker", "--loop", "jobs", "--profile", "enrich"]
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped

  # ------------------------------------------------------------- reranker ---

  reranker:
    build:
      context: .
      dockerfile: Dockerfile
      target: enrich
    image: flowpilot/enrich:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      SERVICE_ROLE: reranker
    command: ["uvicorn", "app.reranker.main:app", "--host", "0.0.0.0", "--port", "8081"]
    volumes:
      - reranker_models:/models
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # -------------------------------------------------------------- ingress ---

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set, e.g. app.example.com}
      API_DOMAIN: ${API_DOMAIN:-}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL must be set}
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  reranker_models:
  caddy_data:
  caddy_config: