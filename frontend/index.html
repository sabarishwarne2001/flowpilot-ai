<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Servabo: the AI back office that keeps every promise your documents make."
    />

    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />

    <!-- The saved theme, before first paint (public/theme-boot.js). -->
    <script src="/theme-boot.js"></script>

    <!-- Default Browser Title -->
    <title>Servabo</title>

    <!-- The Servabo mark (brand/assets); a tenant's own favicon replaces the first icon on its domain. -->
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Servabo" />
    <meta property="og:description" content="The AI back office that keeps every promise your documents make." />
    <meta property="og:image" content="/og-servabo.png" />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
