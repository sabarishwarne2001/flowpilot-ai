# ARCH-0V Tranche 1 — the verification substrate.
#
# WHAT THIS FIXES
#
# At ARCH-22 completion the repository contained 56 `scripts/verify_*.py`
# gates and 116 test files, and none of them ran unless a human typed the
# command. Twenty-two phases of architectural invariants — cost-basis
# truthfulness, tenant isolation, orphaned-guard detection, migration head
# discipline — were enforced by memory rather than by mechanism.
#
# ARCH-02 Step 10 described the tenant isolation suite as "a permanent CI
# gate". It was not a gate. This file is what makes that sentence true.
#
# JOB LAYOUT
#
#   encoding      — cheapest checks first; fails in ~15s if a BOM lands
#   (backend-gates — the historical verify_*.py gates — was retired in the final release:
#    the gates are in archive/, superseded by the pytest suites below; see archive/README.md)
#   backend-tests — pytest against real Postgres + Redis
#   migrations    — upgrade head, zero autogenerate drift, exactly one head
#   frontend      — tsc, lint, build
#
# `encoding` gates the rest deliberately: if the manifests are unreadable
# there is no point spending six minutes installing from them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match backend/Dockerfile (python:3.12-slim). requirements.txt pins
  # scipy==1.18.0, which has no Python 3.11 build.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # Encoding — 15 seconds, no dependencies, gates everything downstream.
  # ---------------------------------------------------------------------
  encoding:
    name: Encoding & line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: No BOMs, no UTF-16, no CRLF in tracked text files
        working-directory: backend
        run: python scripts/normalize_encodings.py --check

  # ---------------------------------------------------------------------
  # Test suites — real Postgres, real Redis.
  # ---------------------------------------------------------------------
  backend-tests:
    name: pytest
    runs-on: ubuntu-latest
    needs: encoding

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Migrate the test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://flowpilot:flowpilot@localhost:5432/flowpilot_test
          # app.core.config builds the database URI from POSTGRES_*; DATABASE_URL
          # is read only by the backup scripts.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_test
          # Fresh, throwaway database: the lossy ARCH-40 contract step has
          # nothing to lose here, and the models already assume it ran.
          ARCH40_CONTRACT: "1"
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
        run: alembic upgrade head

      # Phase 2 proofs (tenant isolation, plan gating, auth, uploads, webhooks, the production
      # start-up guard, deployment files, backups). Run FIRST and on their own: the full suite
      # below stops at its first 5 failures, and the Phase 1 baseline is red (F-016), so it would
      # otherwise never reach these on a pull request. See docs/hardening/02-security-deploy.md.
      - name: Phase 2 security and deployment proofs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://flowpilot:flowpilot@localhost:5432/flowpilot_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_test
          ARCH40_CONTRACT: "1"
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
          AUTH_LOGIN_MIN_DURATION_MS: "250"
          # A platform mail relay is part of a working deployment (identity mail and the
          # resolution every sender goes through need one); without it the email-resolution
          # tests and the engines' isolation sweep fail. Nothing is sent in these steps: the
          # address only has to be declared, so it points at a port nothing listens on.
          PLATFORM_SMTP_HOST: 127.0.0.1
          PLATFORM_SMTP_PORT: "1"
          PLATFORM_SMTP_USERNAME: ci-relay
          PLATFORM_SMTP_PASSWORD: ci-relay-password
          PLATFORM_SMTP_ENCRYPTION: NONE
        run: |
          pytest -q -p no:cacheprovider \
            tests/security \
            tests/core/test_production_config_guard.py \
            tests/infra/test_production_env_template.py \
            tests/infra/test_production_compose_commands.py \
            tests/infra/test_gunicorn_access_log.py \
            tests/infra/test_compose_backup_scripts.py \
            tests/api/test_health_readiness.py \
            tests/models/test_nullable_json_columns.py \
            tests/services/test_chunk_writer_bbox.py \
            tests/services/test_chunk_writer_bbox_null.py \
            tests/services/test_paddle_ocr_honest_failure.py \
            tests/services/test_paddle_no_fabricated_text.py \
            tests/services/test_llm_blank_platform_key.py

      # Phase 4 proofs: every core engine driven live (upload -> worker -> database -> API) with a
      # recorded model, plus the defects fixed in Phase 4 and the invariants repaired there. Own
      # step for the same reason as the Phase 2 proofs. See docs/hardening/04-core-engines.md.
      - name: Phase 4 engine proofs
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://flowpilot:flowpilot@localhost:5432/flowpilot_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_test
          ARCH40_CONTRACT: "1"
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
          AUTH_LOGIN_MIN_DURATION_MS: "250"
          # A platform mail relay is part of a working deployment (identity mail and the
          # resolution every sender goes through need one); without it the email-resolution
          # tests and the engines' isolation sweep fail. Nothing is sent in these steps: the
          # address only has to be declared, so it points at a port nothing listens on.
          PLATFORM_SMTP_HOST: 127.0.0.1
          PLATFORM_SMTP_PORT: "1"
          PLATFORM_SMTP_USERNAME: ci-relay
          PLATFORM_SMTP_PASSWORD: ci-relay-password
          PLATFORM_SMTP_ENCRYPTION: NONE
        run: |
          pytest -q -p no:cacheprovider \
            tests/engines \
            tests/isolation/test_data_isolation.py \
            tests/isolation/test_notification_organization_scope.py \
            tests/isolation/test_structural_invariants.py \
            tests/services/test_billing_account_lock.py \
            tests/services/test_vector_scoping.py \
            tests/services/test_embedding_metering.py \
            tests/services/test_usage_and_spend.py \
            tests/services/test_slo_service.py \
            tests/services/test_pdfium_call_sites_thread_safety.py \
            tests/services/test_arch11_5_hardening.py \
            tests/services/test_arch12_streaming.py \
            tests/services/test_arch12_notifications.py \
            tests/services/test_arch13_gate_13_3_13_4_persistence.py \
            tests/services/test_arch13_gate_13_5_13_6_engine.py \
            tests/services/test_arch15_gate_15_1_15_2_inbound.py \
            tests/services/test_arch15_gate_15_3_15_4_subscriptions_seats.py \
            tests/services/test_arch15_gate_15_5_15_6_invoices.py \
            tests/services/test_arch15_gate_15_7_15_8_portal_dunning.py \
            tests/services/test_deprovision_last_owner_race.py \
            tests/services/test_sec1_gate_1_auth_time.py \
            tests/services/test_cost_truth_consolidation.py \
            tests/api/test_invitation_paid_org.py \
            tests/api/test_audit_export.py \
            tests/api/test_organization_email_settings.py \
            tests/api/test_arch13_gate_13_8_verification_api.py \
            tests/api/test_arch16_scim_dunning.py \
            tests/api/test_arch23_endpoints.py \
            tests/api/test_arch25_endpoints.py \
            tests/api/test_arch26_endpoints.py \
            tests/api/test_arch0g_endpoints.py \
            tests/api/test_api_key_issuance.py \
            tests/api/test_api_key_rate_limit.py \
            tests/services/test_usage_api.py

      - name: pytest
        # Still runs when the proofs above fail, so one red step does not hide the other.
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://flowpilot:flowpilot@localhost:5432/flowpilot_test
          # app.core.config builds the database URI from POSTGRES_*; DATABASE_URL
          # is read only by the backup scripts.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_test
          # Fresh, throwaway database: the lossy ARCH-40 contract step has
          # nothing to lose here, and the models already assume it ran.
          ARCH40_CONTRACT: "1"
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
          # Non-zero so the ARCH-0V timing-floor tests exercise the real path.
          AUTH_LOGIN_MIN_DURATION_MS: "250"
          # See the Phase 2 step: a declared (never contacted) platform mail relay.
          PLATFORM_SMTP_HOST: 127.0.0.1
          PLATFORM_SMTP_PORT: "1"
          PLATFORM_SMTP_USERNAME: ci-relay
          PLATFORM_SMTP_PASSWORD: ci-relay-password
          PLATFORM_SMTP_ENCRYPTION: NONE
        run: pytest -q --maxfail=5

  # ---------------------------------------------------------------------
  # Migrations — head discipline, per invariant I10.
  # ---------------------------------------------------------------------
  migrations:
    name: Migration head & drift
    runs-on: ubuntu-latest
    needs: encoding

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exactly one head
        working-directory: backend
        env: &migrate_env
          DATABASE_URL: postgresql+psycopg://flowpilot:flowpilot@localhost:5432/flowpilot_migrate
          # app.core.config builds the database URI from POSTGRES_*; DATABASE_URL
          # is read only by the backup scripts.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_migrate
          # Fresh, throwaway database: the lossy ARCH-40 contract step has
          # nothing to lose here, and the models already assume it ran.
          ARCH40_CONTRACT: "1"
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
          API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
          REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
          EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
          SERVICE_ROLE: web
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads."
            exit 1
          fi

      - name: Upgrade to head
        working-directory: backend
        env: *migrate_env
        run: alembic upgrade head

      - name: Downgrade one step and upgrade again
        working-directory: backend
        env: *migrate_env
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: No new autogenerate drift
        # The old inline check grepped ci_drift_probe.py, but alembic.ini
        # names the probe <rev>_<slug>.py, so it never found the file and
        # always passed. Known drift is listed in alembic/drift_baseline.txt
        # (FINDINGS F-017); this fails on any new drift and on any listed
        # line that no longer drifts.
        working-directory: backend
        env: *migrate_env
        run: python scripts/check_migration_drift.py

  # ---------------------------------------------------------------------
  # Frontend — typecheck, lint (functional from ARCH-0V Tranche 3), build.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: encoding
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Typecheck the browser tests
        working-directory: frontend
        run: npx tsc -p e2e/tsconfig.json

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The tenant-resolution, path, reconciliation and permission self-checks; before, they ran
      # only in a development browser's console.
      - name: Self-checks
        working-directory: frontend
        run: npm run check:self

      - name: Build
        working-directory: frontend
        run: npm run build

      # F-038. A source map is the original TypeScript source and Caddy serves
      # all of dist/, so a built map is a public map.
      - name: No source maps in the production bundle
        working-directory: frontend
        run: node scripts/check-no-sourcemaps.mjs --dist

      # F-039. Blocking at "high": the lockfile had 6 high advisories until the
      # non-breaking `npm audit fix` in Phase 2. Keep it at zero.
      - name: npm audit (high and critical)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Advisory: known vulnerabilities in the pinned Python packages (F-039).
  # Not part of the required aggregate, on purpose: the remaining findings need
  # a FastAPI/Starlette line upgrade and a cryptography major bump that must be
  # done together with the full test suite (see docs/hardening/02-security-deploy.md).
  # The job keeps the list visible on every pull request instead of stale.
  # ---------------------------------------------------------------------
  dependency-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip --progress-spinner off

  # ---------------------------------------------------------------------
  # Phase 3 browser tests (Playwright, headless Chromium) against the real API,
  # worker, Postgres and Redis, with ML_STUBS=true and a local SMTP sink. See
  # frontend/e2e/README.md and docs/hardening/03-coverage.md.
  #
  # ADVISORY: not in the aggregate `ci` job below. The suite is strict (any
  # console error or unexpected 4xx/5xx fails a test) and records today's open
  # findings as red tests; making it required now would block every PR. Add it
  # to `needs` once the Phase 4 fix loop has turned it green.
  # ---------------------------------------------------------------------
  e2e:
    name: Browser tests (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: encoding
    timeout-minutes: 90

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot
      POSTGRES_DB: flowpilot_e2e
      REDIS_URL: redis://localhost:6379/0
      ARCH40_CONTRACT: "1"
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef0123456789
      API_KEY_PEPPER: ci-only-not-a-real-pepper-0123456789abcdef0123456789
      REDIS_IDENTITY_PEPPER: ci-only-not-real-0123456789abcdef0123456789ab
      RERANKER_INTERNAL_TOKEN: ci-only-not-a-real-token-0123456789abcdef01234567
      EMAIL_ENCRYPTION_KEYS: 4pQZ8kLmN2vX7bR1sT5wY9cA3dF6gH0jK4nP8qU2eI0=
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      ML_STUBS: "true"
      STORAGE_BACKEND: local
      RATE_LIMIT_ENABLED: "false"
      PLATFORM_SMTP_HOST: 127.0.0.1
      PLATFORM_SMTP_PORT: "1025"
      PLATFORM_SMTP_USERNAME: e2e-relay
      PLATFORM_SMTP_PASSWORD: e2e-relay-password
      PLATFORM_SMTP_ENCRYPTION: NONE
      E2E_PYTHON: python
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
      # F-063: a deterministic local model stand-in (frontend/e2e/support/llm-mock.mjs) behind the
      # sovereign edition's LOCAL_LLM_MODE=exclusive, so extraction, verification, the review queue,
      # tables, matching and the assistant run end to end without a provider key.
      E2E_LLM: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start the API, worker and mail sink
        run: frontend/e2e/scripts/start-stack.sh

      - name: Run the browser tests
        working-directory: frontend
        env:
          CI: "1"
        run: npx playwright test -c e2e

      - name: Upload the report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
            e2e-logs
          retention-days: 14

  # ---------------------------------------------------------------------
  # Aggregate status. Branch protection points at this one job, so adding a
  # job above does not require editing the protection rule.
  # ---------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [encoding, backend-tests, migrations, frontend]
    steps:
      - name: Fail if any upstream job failed
        # Expressions accept only single-quoted strings. A double-quoted ","
        # here made GitHub reject the whole file, so no job ever ran.
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs green."
